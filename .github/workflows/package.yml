name: Package

on: [push, pull_request]

permissions:
  contents: read

jobs:
  package_linux:
    name: Linux Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'

      - name: Install libqxcb dependencies
        run: sudo apt install libfontconfig1-dev libfreetype6-dev libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev libxcb1-dev libxcb-glx0-dev libxcb-keysyms1-dev libxcb-image0-dev libxcb-shm0-dev libxcb-icccm4-dev libxcb-sync0-dev libxcb-xfixes0-dev libxcb-shape0-dev libxcb-randr0-dev libxcb-render-util0-dev libxcb-xinerama0-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Install libsodium
        run: sudo apt install libsodium-dev

      - name: Install linuxdeploy
        run: |
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-*.AppImage

      - name: Build
        working-directory: ./WireHop
        run: qmake && make -j$(nproc)

      - name: Package
        run: |
          ./linuxdeploy-x86_64.AppImage --appdir AppDir -e WireHop/WireHop -d misc/WireHop.desktop -i WireHop/icons/app.svg --icon-filename wirehop -p qt -o appimage
          mv WireHop*.AppImage WireHop-linux.AppImage

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: Linux-Build
          path: WireHop-linux.AppImage

  package_windows:
    name: Windows Package
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'

      - name: Install libsodium
        shell: bash
        run: |
          curl -LO https://download.libsodium.org/libsodium/releases/libsodium-1.0.18-stable-msvc.zip
          unzip libsodium-1.0.18-stable-msvc.zip

      - name: Configure
        shell: bash
        working-directory: ./WireHop
        run: |
          echo "INCLUDEPATH += ../libsodium/include" >> WireHop.pro
          echo "LIBS += -L../libsodium/x64/Release/v142/dynamic -llibsodium" >> WireHop.pro

      - name: Build
        shell: cmd
        working-directory: ./WireHop
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2019\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          qmake -tp vc
          msbuild -m -p:Configuration=Release .

      - name: Package
        shell: bash
        working-directory: ./WireHop
        run: |
          mkdir WireHop
          cd WireHop
          mv ../release/WireHop.exe .
          windeployqt WireHop.exe
          cp ../../libsodium/x64/Release/v142/dynamic/libsodium.dll .
          curl -LO https://aka.ms/vs/16/release/vc_redist.x64.exe

      - name: Zip
        working-directory: ./WireHop
        run: Compress-Archive WireHop WireHop-win.zip

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: Windows-Build
          path: WireHop/WireHop-win.zip

  package_macos:
    name: macOS Package
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'

      - name: Install libsodium
        run: brew install libsodium

      - name: Build
        working-directory: ./WireHop
        run: qmake && make -j$(sysctl -n hw.ncpu)

      - name: Package
        working-directory: ./WireHop
        run: |
          macdeployqt WireHop.app
          zip -r9 --symlinks WireHop-macos.zip WireHop.app

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: macOS-Build
          path: WireHop/WireHop-macos.zip
