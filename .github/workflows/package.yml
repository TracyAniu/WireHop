name: Package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package_linux:
    name: Linux Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'

      - name: Install libqxcb dependencies
        run: sudo apt install libfontconfig1-dev libfreetype6-dev libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev libxcb1-dev libxcb-glx0-dev libxcb-keysyms1-dev libxcb-image0-dev libxcb-shm0-dev libxcb-icccm4-dev libxcb-sync0-dev libxcb-xfixes0-dev libxcb-shape0-dev libxcb-randr0-dev libxcb-render-util0-dev libxcb-xinerama0-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Install libsodium
        run: sudo apt install libsodium-dev

      - name: Install linuxdeploy
        run: |
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-*.AppImage

      - name: Build
        working-directory: ./WireHop
        run: qmake && make -j$(nproc)

      - name: Package
        run: |
          install -m 755 WireHop/WireHop WireHop/wirehop
          ./linuxdeploy-x86_64.AppImage --appdir AppDir -e WireHop/wirehop -d misc/WireHop.desktop -i WireHop/icons/app.svg --icon-filename wirehop -p qt -o appimage
          mv WireHop*.AppImage WireHop-linux.AppImage

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: Linux-Build
          path: WireHop-linux.AppImage

  package_windows:
    name: Windows Package
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'

      - name: Install libsodium
        shell: bash
        run: |
          curl -fLO https://github.com/jedisct1/libsodium/releases/download/1.0.22-RELEASE/libsodium-1.0.22-msvc.zip
          unzip libsodium-1.0.22-msvc.zip

      - name: Configure
        shell: bash
        working-directory: ./WireHop
        run: |
          echo "INCLUDEPATH += ../libsodium/include" >> WireHop.pro
          echo "LIBS += -L../libsodium/x64/Release/v143/dynamic -llibsodium" >> WireHop.pro

      - name: Build
        shell: cmd
        working-directory: ./WireHop
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          qmake
          nmake release

      - name: Package
        shell: bash
        working-directory: ./WireHop
        run: |
          mkdir WireHop
          cd WireHop
          mv ../release/WireHop.exe .
          windeployqt WireHop.exe
          cp ../../libsodium/x64/Release/v143/dynamic/libsodium.dll .
          curl -LO https://aka.ms/vs/16/release/vc_redist.x64.exe

      - name: Zip
        working-directory: ./WireHop
        run: Compress-Archive WireHop WireHop-win.zip

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: Windows-Build
          path: WireHop/WireHop-win.zip

  package_macos:
    name: macOS arm64 Package
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Qt and libsodium
        run: |
          brew install qt@5 libsodium
          echo "$(brew --prefix qt@5)/bin" >> "$GITHUB_PATH"

      - name: Build
        run: ./scripts/typecheck.sh

      - name: Package
        run: |
          macdeployqt build-agent/WireHop.app
          file build-agent/WireHop.app/Contents/MacOS/WireHop | grep -q arm64
          otool -L build-agent/WireHop.app/Contents/MacOS/WireHop | grep -q '@executable_path/../Frameworks/libsodium'
          ditto -c -k --sequesterRsrc --keepParent build-agent/WireHop.app WireHop-macos-arm64.zip

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: macOS-arm64-Build
          path: WireHop-macos-arm64.zip
